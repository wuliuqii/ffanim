name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy（无 GPU 特性，覆盖 CPU 兜底路径）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc 零警告（missing_docs 门禁）
        run: cargo doc --workspace --no-deps
      - name: 安装 ffmpeg（runner 镜像未预装，出片测试依赖）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 测试
        run: cargo test --workspace

  # GPU 特性编译验证（无 GPU 硬件，运行时测试自动跳过）
  build-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy（GPU 特性）
        run: cargo clippy --workspace --all-targets --features ffanim-render/gpu -- -D warnings
      - name: 安装 ffmpeg（runner 镜像未预装，出片测试依赖）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 测试（GPU 不可用时相关测试自动跳过）
        run: cargo test --workspace --features ffanim-render/gpu
