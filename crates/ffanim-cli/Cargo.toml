[package]
name = "ffanim-cli"
description = "ffanim 命令行：渲染与 Agent 验证工具链"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ffanim"
path = "src/main.rs"
# 门面 lib（crates/ffanim）与 CLI bin 同名 → rustdoc 输出路径冲突，bin 不产文档
doc = false

[lints]
workspace = true

[dependencies]
ffanim = { path = "../ffanim" }
ffanim-core = { workspace = true }
ffanim-render = { path = "../ffanim-render" }
ffanim-encode = { path = "../ffanim-encode" }
ffanim-typst = { path = "../ffanim-typst" }
ffanim-preview = { path = "../ffanim-preview" }
ffanim-audio = { path = "../ffanim-audio" }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }

[features]
gpu = ["ffanim-render/gpu"]
