[package]
name = "ffanim-core"
description = "ffanim 核心对象模型与时间轴系统"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
kurbo = "0.13"
ttf-parser = { version = "0.25", default-features = false }
rustybuzz = "0.20"
# 系统字体发现（M8.7）：fontdb 走 fontconfig/CoreText/DirectWrite 全平台正规通道，
# 硬编码路径列表仅作其失效时的最后兜底
fontdb = "0.23"
# SVG 导入（M8.4）：usvg 解析 + tiny-skia-path 段 → kurbo；不启用 text（跳过文本节点）
usvg = { version = "0.45", default-features = false }
tiny-skia-path = "0.11"
i_overlay = "9.1.0"
# 3D 线代件（docs/07 §2.2）：glam f64 全套（零传递依赖，仅 f64 精度类型，
# 不引 f32/整数类型），锁小版本对冲 API 变动（typst/i_overlay 同款策略）
glam = { version = "0.34.1", default-features = false, features = ["std", "f64"] }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "pipeline"
harness = false
